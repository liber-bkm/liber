name: Release

on:
  release:
    types: [published]
  # Manual dry run without cutting a release (versioned artifacts fall back
  # to local defaults; nothing is uploaded).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag format
        # PKGBUILD asset URLs use the bare version; a v-prefixed tag would break them.
        run: |
          case "$GITHUB_REF_NAME" in
            v*) echo "tag must not have a v prefix (e.g. 0.7.1), got: $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Vet and test
        run: |
          go vet ./...
          go build ./...
          go test -v ./...

      - name: Cross-compile
        run: |
          set -e
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build \
              -ldflags "-X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/$3" .
          }
          build linux amd64 liber
          build linux arm64 liber-linux-arm64
          build darwin amd64 liber-darwin-amd64
          build darwin arm64 liber-darwin-arm64

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Resolve Android versions
        id: androidver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            IFS=. read -r MA MI PA <<<"$TAG"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "code=$((10#$MA*10000 + 10#$MI*100 + 10#$PA))" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android wrapper
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}" sh android/scripts/build-go-lib.sh
          props=()
          if [ -n "${{ steps.androidver.outputs.name }}" ]; then
            props=("-PliberVersionName=${{ steps.androidver.outputs.name }}" "-PliberVersionCode=${{ steps.androidver.outputs.code }}")
          fi
          cd android
          ./gradlew assembleDebug --no-daemon "${props[@]}"
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/liber-android-debug.apk

      - name: Upload debug APK artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: liber-android-debug
          path: dist/liber-android-debug.apk

      - name: Check for signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Android release
        if: github.event_name == 'release' && steps.signing.outputs.enabled == 'true'
        env:
          LIBER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIBER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIBER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/liber-release.keystore
          export LIBER_KEYSTORE_PATH=/tmp/liber-release.keystore
          cd android
          ./gradlew assembleRelease --no-daemon "-PliberVersionName=${{ steps.androidver.outputs.name }}" "-PliberVersionCode=${{ steps.androidver.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk ../dist/liber-android.apk
          rm -f /tmp/liber-release.keystore

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: PKGBUILD
        run: |
          mkdir -p dist
          sed "s/@VERSION@/${GITHUB_REF_NAME#v}/" packaging/PKGBUILD > dist/PKGBUILD
          cp packaging/PKGBUILD-git dist/PKGBUILD-git
          # sanity: makepkg --lint is Arch-only; at least refuse unsubstituted versions
          ! grep -q '@VERSION@' dist/PKGBUILD
          bash -n dist/PKGBUILD
          bash -n dist/PKGBUILD-git

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/liber
            dist/liber-linux-arm64
            dist/liber-darwin-amd64
            dist/liber-darwin-arm64
            dist/liber-android-debug.apk
            dist/SHA256SUMS.txt
            dist/PKGBUILD
            dist/PKGBUILD-git
          )
          if [ -f dist/liber-android.apk ]; then
            assets+=(dist/liber-android.apk)
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
