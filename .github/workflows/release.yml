name: release
on:
  push:
    tags: ["v*"]

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}

jobs:
  gates:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: cargo test -p liber-core -p liber-cli -p liber-server
      - run: cargo clippy -p liber-core -p liber-cli -p liber-server --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build && pnpm test

  version-check:
    needs: gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag matches declared versions
        if: github.ref_type == 'tag'
        run: >-
          python3 -c "import json,re,os;
          tag = os.environ['VERSION'].lstrip('v');
          cargo = re.search(r'^version = \"([^\"]+)\"', open('Cargo.toml').read(), re.M).group(1);
          conf = json.load(open('crates/liber-tauri/tauri.conf.json'))['version'];
          assert (cargo, conf) == (tag, tag), f'tag {tag} vs cargo {cargo} vs conf {conf}'"

  linux:
    needs: version-check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev patchelf
          libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - run: EMBED_UI=1 cargo build --release -p liber-cli -p liber-server
      - run: cd crates/liber-tauri && ../../frontend/node_modules/.bin/tauri build
      - name: stage tarball
        run: |
          v="${VERSION#v}"
          mkdir -p "dist/liber-$v"
          cp target/release/liber target/release/liber-serve target/release/liber-tauri "dist/liber-$v/"
          cp target/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm dist/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          (cd dist && tar -czf "liber-$v-linux-${{ matrix.arch }}.tar.gz" "liber-$v")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  windows:
    needs: version-check
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: choco install nsis -y
      - run: cd frontend; pnpm install --frozen-lockfile; pnpm build
      - run: $env:EMBED_UI = "1"; cargo build --release -p liber-cli -p liber-server
      - run: cd crates/liber-tauri; ../../frontend/node_modules/.bin/tauri build --bundles nsis
      - name: stage zip
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/liber-$v" | Out-Null
           Copy-Item target/release/liber.exe, target/release/liber-serve.exe, target/release/liber-tauri.exe "dist/liber-$v/"
           if (-not (Test-Path target/release/bundle/nsis/*.exe)) { throw "no NSIS installer produced by tauri build" }
           Copy-Item target/release/bundle/nsis/*.exe dist/
          Compress-Archive -Path "dist/liber-$v" -DestinationPath "dist/liber-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/

  macos:
    needs: version-check
    if: github.ref_type == 'tag'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - run: EMBED_UI=1 cargo build --release -p liber-cli -p liber-server --target aarch64-apple-darwin
      - run: EMBED_UI=1 cargo build --release -p liber-cli -p liber-server --target x86_64-apple-darwin
      - run: cd crates/liber-tauri && ../../frontend/node_modules/.bin/tauri build --target universal-apple-darwin
      - name: stage universal CLI plus dmg
        run: |
          v="${VERSION#v}"
          mkdir -p dist/liber-$v
          lipo -create target/aarch64-apple-darwin/release/liber target/x86_64-apple-darwin/release/liber -output dist/liber-$v/liber
          lipo -create target/aarch64-apple-darwin/release/liber-serve target/x86_64-apple-darwin/release/liber-serve -output dist/liber-$v/liber-serve
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          (cd dist && tar -czf liber-$v-macos-universal.tar.gz liber-$v)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/

  android:
    needs: version-check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - name: install SDK pieces
        run: |
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$HOME/Android/Sdk/cmdline-tools" && cd "$HOME/Android/Sdk/cmdline-tools"
          unzip -q -o /tmp/cmdtools.zip && mkdir -p latest && mv cmdline-tools/* latest/
          export ANDROID_HOME="$HOME/Android/Sdk" ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | latest/bin/sdkmanager --licenses >/dev/null
          latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: stamp versions into generated project
        run: |
          cd crates/liber-tauri
          if [ ! -d gen/android/app ]; then
            ../../frontend/node_modules/.bin/tauri android init
          fi
          v="${VERSION#v}"
          cp android-version.properties gen/android/app/tauri.properties
          printf '\ntauri.android.versionName=%s\n' "$v" >> gen/android/app/tauri.properties
      - run: cd crates/liber-tauri && ../../frontend/node_modules/.bin/tauri android build
      - name: sign release artifacts
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            [ -n "${!v}" ] || { echo "missing secret for $v (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD)"; exit 1; }
          done
          shopt -s nullglob
          BT="$ANDROID_HOME/build-tools/36.0.0"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/liber-release.keystore
          mkdir -p dist
          apks=(crates/liber-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          aabs=(crates/liber-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab)
          [ ${#apks[@]} -gt 0 ] || { echo "no universal APKs produced by tauri android build"; exit 1; }
          [ ${#aabs[@]} -gt 0 ] || { echo "no universal AABs produced by tauri android build"; exit 1; }
          for f in "${apks[@]}"; do
            out="dist/$(basename "${f%.apk}")-signed.apk"
            "$BT/apksigner" sign --ks /tmp/liber-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass:env STORE_PASSWORD --key-pass:env KEY_PASSWORD --out "$out" "$f"
          done
          for f in "${aabs[@]}"; do
            out="dist/$(basename "${f%.aab}")-signed.aab"
            "$BT/apksigner" sign --ks /tmp/liber-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass:env STORE_PASSWORD --key-pass:env KEY_PASSWORD --out "$out" "$f"
          done
          rm -f /tmp/liber-release.keystore
          "$BT/apksigner" verify --print-certs dist/*signed.apk | head -3
          "$BT/aapt" dump badging dist/*signed.apk | grep -o "version\(Code\|Name\)='[^']*'" | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  publish:
    needs: [linux, windows, macos, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
