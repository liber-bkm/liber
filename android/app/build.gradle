plugins {
    id 'com.android.application'
}

android {
    namespace 'bkm.liber'
    compileSdk 35

    defaultConfig {
        applicationId 'bkm.liber'
        minSdk 26
        targetSdk 35
        // Overridden by CI from the release tag
        // (-PliberVersionName= -PliberVersionCode=); fallbacks match the
        // current liber release and are only for local debug builds.
        versionCode findProperty('liberVersionCode')?.toInteger() ?: 1
        versionName findProperty('liberVersionName') ?: '0.9.1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('LIBER_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('LIBER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIBER_KEY_ALIAS')
                keyPassword System.getenv('LIBER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed only when the CI release secrets are present
            // (LIBER_KEYSTORE_PATH/PASSWORD, LIBER_KEY_ALIAS/PASSWORD).
            // Otherwise Gradle still assembles an unsigned APK.
            if (System.getenv('LIBER_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        // Keep the Go binary as an extractable file we can execute.
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: framework WebView only, so builds need
// nothing from Maven beyond the Android Gradle Plugin itself.
dependencies {
}
