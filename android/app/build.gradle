import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

kotlin {
    compilerOptions {
        // Must match compileOptions below; the Kotlin default follows the
        // build JVM and drifts (e.g. 21), breaking the build.
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

android {
    namespace 'bkm.liber'
    compileSdk 35
    // Pinned to match the nix-composed SDK (flake devShells.android).
    // The store is read-only, so AGP's auto-install fallback can never work:
    // every SDK component version must be pinned here, not defaulted.
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'bkm.liber'
        minSdk 26
        targetSdk 35
        // Overridden by CI from the release tag
        // (-PliberVersionName= -PliberVersionCode=); fallbacks match the
        // current liber release and are only for local debug builds.
        versionCode findProperty('liberVersionCode')?.toInteger() ?: 1
        versionName findProperty('liberVersionName') ?: '0.9.1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('LIBER_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('LIBER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIBER_KEY_ALIAS')
                keyPassword System.getenv('LIBER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed only when the CI release secrets are present
            // (LIBER_KEYSTORE_PATH/PASSWORD, LIBER_KEY_ALIAS/PASSWORD).
            // Otherwise Gradle still assembles an unsigned APK.
            if (System.getenv('LIBER_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    packagingOptions {
        // Keep the Go binary as an extractable file we can execute.
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

// Framework WebView needs nothing beyond AGP; the native UI slice adds the
// Compose BOM, OkHttp, and kotlinx.serialization (JUnit for unit tests).
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
