<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bookmarked book logo</title>
  <defs>
    <linearGradient id="gCover" gradientUnits="userSpaceOnUse" x1="421.9" y1="424.8" x2="721.0" y2="806.7">
      <stop offset="0.000" stop-color="#ebeefd"/>
      <stop offset="0.287" stop-color="#cbd2fb"/>
      <stop offset="0.500" stop-color="#b6bdfa"/>
      <stop offset="0.713" stop-color="#a2a9f9"/>
      <stop offset="0.926" stop-color="#8f93fa"/>
      <stop offset="1.000" stop-color="#8a8ef9"/>
    </linearGradient>
    <linearGradient id="gCoverTint" gradientUnits="userSpaceOnUse" x1="480" y1="0" x2="670" y2="0">
      <stop offset="0" stop-color="#d9cefc" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9cefc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gPage2" gradientUnits="userSpaceOnUse" x1="512" y1="0" x2="757" y2="0">
      <stop offset="0.000" stop-color="#9fa1fb"/>
      <stop offset="0.192" stop-color="#a8abfb"/>
      <stop offset="0.453" stop-color="#bfc0fc"/>
      <stop offset="0.718" stop-color="#d4cffc"/>
      <stop offset="0.890" stop-color="#d9cffc"/>
      <stop offset="1.000" stop-color="#d9cefc"/>
    </linearGradient>
    <linearGradient id="gPage3" gradientUnits="userSpaceOnUse" x1="566" y1="0" x2="806" y2="0">
      <stop offset="0.000" stop-color="#c0c1fc"/>
      <stop offset="0.287" stop-color="#cccbfb"/>
      <stop offset="0.554" stop-color="#d6d0fc"/>
      <stop offset="0.729" stop-color="#d9cffc"/>
      <stop offset="1.000" stop-color="#d9cefc"/>
    </linearGradient>
    <linearGradient id="gBookmark" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="716">
      <stop offset="0.000" stop-color="#fd8d6b"/>
      <stop offset="0.297" stop-color="#fc896e"/>
      <stop offset="0.612" stop-color="#fd7f78"/>
      <stop offset="0.927" stop-color="#fd7783"/>
      <stop offset="1.000" stop-color="#fd7685"/>
    </linearGradient>
    <linearGradient id="gBack" gradientUnits="userSpaceOnUse" x1="598" y1="0" x2="830" y2="0">
      <stop offset="0.000" stop-color="#141522"/>
      <stop offset="0.181" stop-color="#191a2e"/>
      <stop offset="0.233" stop-color="#1b1c35"/>
      <stop offset="0.276" stop-color="#24244c"/>
      <stop offset="0.353" stop-color="#272752"/>
      <stop offset="0.440" stop-color="#2b2a5d"/>
      <stop offset="0.569" stop-color="#33326e"/>
      <stop offset="0.698" stop-color="#3f3d86"/>
      <stop offset="0.828" stop-color="#42408b"/>
      <stop offset="1.000" stop-color="#43408d"/>
    </linearGradient>
    <linearGradient id="gBackShade" gradientUnits="userSpaceOnUse" x1="0" y1="397" x2="0" y2="905">
      <stop offset="0.000" stop-color="#141521" stop-opacity="0.000"/>
      <stop offset="0.242" stop-color="#141521" stop-opacity="0.220"/>
      <stop offset="0.400" stop-color="#141521" stop-opacity="0.342"/>
      <stop offset="0.557" stop-color="#141521" stop-opacity="0.449"/>
      <stop offset="0.715" stop-color="#141521" stop-opacity="0.513"/>
      <stop offset="1.000" stop-color="#141521" stop-opacity="0.449"/>
    </linearGradient>
  </defs>

  <!-- background (delete this rect for a transparent logo) -->
  <rect id="background" width="1254" height="1254" fill="#141521"/>

  <g id="logo">
    <!-- dark back cover, tucked under the front cover -->
    <path id="back-cover" fill="url(#gBack)" d="M 594.0 512.3 L 814.7 405.6 A 11.9 11.9 0 0 1 831.8 416.4 L 831.7 739.1 A 58.4 58.4 0 0 1 801.6 790.1 L 594.0 905.6 Z"/>
    <!-- vertical shading over the back cover (darker toward the bottom) -->
    <path id="back-cover-shade" fill="url(#gBackShade)" d="M 594.0 512.3 L 814.7 405.6 A 11.9 11.9 0 0 1 831.8 416.4 L 831.7 739.1 A 58.4 58.4 0 0 1 801.6 790.1 L 594.0 905.6 Z"/>

    <!-- bookmark ribbon; its top edge is tucked under page 3 -->
    <path id="bookmark" fill="url(#gBookmark)" d="M 634.3 465.2 L 707.6 428.6 L 710.4 434.4 A 28.6 28.6 0 0 1 751.4 460.2 L 751.4 697.4 A 4.6 4.6 0 0 1 743.7 700.9 L 706.0 667.5 A 1.4 1.4 0 0 0 704.0 667.6 L 664.7 712.4 A 3.8 3.8 0 0 1 658.1 709.9 L 658.1 500.6 A 34.9 34.9 0 0 0 644.4 472.9 Z"/>

    <!-- front cover / spine, including the first (top) page edge -->
    <path id="cover" fill="url(#gCover)" d="M 421.9 440.9 A 33.1 33.1 0 0 1 440.3 411.2 L 653.4 305.7 A 20.9 20.9 0 0 1 673.1 306.4 L 696.6 320.0 L 488.5 422.5 A 8.3 8.3 0 0 0 488.1 437.2 L 580.5 490.4 A 31.9 31.9 0 0 1 596.5 518.0 L 596.5 900.7 A 7.4 7.4 0 0 1 585.4 907.1 L 444.6 827.7 A 44.6 44.6 0 0 1 421.9 788.9 Z"/>
    <!-- lavender tint fading in across the first page edge -->
    <path id="cover-page-tint" fill="url(#gCoverTint)" d="M 457.2 402.9 L 653.4 305.7 A 20.9 20.9 0 0 1 673.1 306.4 L 696.6 320.0 L 478.5 427.4 A 8.3 8.3 0 0 1 470.6 427.2 L 457.2 419.4 Z"/>

    <!-- page 2 and page 3 -->
    <path id="page-2" fill="url(#gPage2)" d="M 512.4 431.6 L 723.3 328.6 A 19.9 19.9 0 0 1 751.9 346.4 L 751.9 347.5 A 4.5 4.5 0 0 1 749.4 351.6 L 548.0 450.9 A 2.6 2.6 0 0 1 545.6 450.8 Z"/>
    <path id="page-3" fill="url(#gPage3)" d="M 567.7 463.5 A 0.7 0.7 0 0 1 567.7 462.2 L 773.5 361.3 A 21.3 21.3 0 0 1 804.2 380.9 L 804.2 380.7 A 15.3 15.3 0 0 1 795.5 394.1 L 607.2 483.8 A 5.8 5.8 0 0 1 601.7 483.6 Z"/>
  </g>
</svg>
