# Manual release counter for Android. Raise the integer below by hand
# on every release; Google Play rejects uploads that do not increase
# it. (Keep the word "versionCode" out of these comments: CI reads
# this file with an anchored grep, and stray matches break it.)
# CI copies this file to gen/android/app/tauri.properties during release
# builds (that path is generated and gitignored).
tauri.android.versionCode=2
